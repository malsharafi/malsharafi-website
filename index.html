<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohammad Al-Sharafi | Coming Soon</title>
  <style>
    :root {
      --ink: #16211d;
      --muted: #53615b;
      --paper: #f8f7f2;
      --accent: #1f7a65;
      --accent-strong: #e0523f;
      --line: rgba(22, 33, 29, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 18%, rgba(224, 82, 63, 0.16), transparent 30%),
        radial-gradient(circle at 84% 72%, rgba(31, 122, 101, 0.18), transparent 34%),
        linear-gradient(135deg, #f8f7f2 0%, #eef3ee 48%, #f6eee8 100%);
      display: grid;
      place-items: center;
      padding: 32px;
    }

    main {
      width: min(920px, 100%);
      min-height: min(620px, calc(100vh - 64px));
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 24px 80px rgba(22, 33, 29, 0.14);
      backdrop-filter: blur(18px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(22px, 5vw, 56px);
    }

    nav,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .brand {
      color: var(--ink);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 7px rgba(31, 122, 101, 0.14);
    }

    .hero {
      align-self: center;
      max-width: 760px;
      padding: 72px 0;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.7rem);
      line-height: 0.94;
      letter-spacing: 0;
      max-width: 760px;
    }

    .name {
      display: block;
      color: var(--accent-strong);
    }

    .message {
      max-width: 560px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.7;
    }

    .divider {
      width: min(360px, 70%);
      height: 1px;
      margin: 36px 0;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .soon {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .soon span {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(31, 122, 101, 0.34);
      display: grid;
      place-items: center;
      color: var(--accent);
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      main {
        min-height: calc(100vh - 36px);
        padding: 22px;
      }

      nav,
      footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        padding: 54px 0;
      }

      h1 {
        font-size: clamp(2.7rem, 17vw, 4.4rem);
      }
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Page">
      <div class="brand">Mohammad Al-Sharafi</div>
      <div class="status">Website in progress</div>
    </nav>

    <section class="hero" aria-labelledby="coming-soon-title">
      <p class="eyebrow">Personal website</p>
      <h1 id="coming-soon-title">
        <span class="name">Mohammad Al-Sharafi</span>
        Coming Soon
      </h1>
      <p class="message">
        A new home on the web is being prepared. Thanks for stopping by.
      </p>
      <div class="divider" aria-hidden="true"></div>
      <div class="soon"><span aria-hidden="true">+</span> Launching soon</div>
    </section>

    <footer>
      <div>Built for GitHub Pages</div>
      <div>&copy; 2026 Mohammad Al-Sharafi</div>
    </footer>
  </main>
</body>
</html>
